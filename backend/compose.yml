services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hotel_new_era
      POSTGRES_PASSWORD: hotel_new_era_dev
      POSTGRES_DB: hotel_new_era_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_new_era -d hotel_new_era_development"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - hotel_new_era_postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0 -p 3001"
    environment:
      DB_HOST: db
      DB_USERNAME: hotel_new_era
      DB_PASSWORD: hotel_new_era_dev
      JWT_SECRET_KEY: local-development-secret-change-before-deployment
      BCRYPT_COST: 8
      FRONTEND_ORIGINS: http://localhost:3000
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      ESEWA_MODE: ${ESEWA_MODE:-sandbox}
      ESEWA_PRODUCT_CODE: ${ESEWA_PRODUCT_CODE:-}
      ESEWA_SECRET_KEY: ${ESEWA_SECRET_KEY:-}
      KHALTI_MODE: ${KHALTI_MODE:-sandbox}
      KHALTI_SECRET_KEY: ${KHALTI_SECRET_KEY:-}
      RAILS_ENV: development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - .:/rails

  stay_monitor:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bundle exec rails runner script/monitor_stays.rb
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USERNAME: hotel_new_era
      DB_PASSWORD: hotel_new_era_dev
      RAILS_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/rails

volumes:
  hotel_new_era_postgres:
